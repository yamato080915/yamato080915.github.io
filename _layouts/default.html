<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Squada+One&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="{{ '/static/css/site.css' | relative_url }}">
	{% for stylesheet in page.css %}
		<link rel="stylesheet" href="{{ stylesheet | relative_url }}">
	{% endfor %}
	<title>{{ page.title }}</title>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
	<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/95 backdrop-blur">
		<nav class="site-shell">
			<div class="flex min-h-16 items-center justify-between gap-4">
				<a class="flex items-center gap-2 font-bold tracking-tight text-slate-950 hover:text-brand-600" href="{{ '/' | relative_url }}">
					<span>Home</span>
				</a>
				<div class="hidden items-center gap-1 md:flex">
					<a href="{{ '/valorant/tournament/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-950">カスタム大会</a>
					<a href="{{ '/valorant/team-shuffle/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-950">チーム分け</a>
					<a href="{{ '/valorant/map-roulette/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-950">マップルーレット</a>
					<a href="{{ '/valorant/ban-pick/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-950">バンピック</a>
				</div>
				<button id="nav-toggle" class="grid size-11 place-items-center rounded-xl border border-slate-300 bg-white text-xl text-slate-700 hover:bg-slate-50 md:hidden" type="button" aria-controls="nav-menu" aria-expanded="false" aria-label="Toggle navigation">
					<i class="bi bi-list" aria-hidden="true"></i>
				</button>
			</div>
			<div id="nav-menu" class="hidden border-t border-slate-200 py-3 md:hidden">
				<div class="grid gap-1">
					<a href="{{ '/valorant/tournament/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">カスタム大会</a>
					<a href="{{ '/valorant/team-shuffle/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">チーム分け</a>
					<a href="{{ '/valorant/map-roulette/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">マップルーレット</a>
					<a href="{{ '/valorant/ban-pick/' | relative_url }}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">バンピック</a>
				</div>
			</div>
		</nav>
	</header>
	<main class="site-shell py-10 sm:py-14">
		{{ content }}
	</main>
	<script src="{{ '/static/site.js' | relative_url }}"></script>
</body>
</html>
