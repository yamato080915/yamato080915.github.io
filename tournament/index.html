---
layout: default
title: CUSTOM TOURNAMENT TOOL
redirect_from:
  - /valorant/tournament/
---

<div id="tournament-app" class="tournament-app pb-5">
	<section class="tournament-hero mb-8">
		<div class="relative z-10"><p class="tournament-eyebrow mb-2">CUSTOM TOURNAMENT TOOL</p><h1 class="text-3xl font-bold tracking-tight sm:text-4xl">カスタム大会進行ボード</h1><p class="mt-3 text-white/65">予選、トーナメント、総当たり戦をひとつの画面で管理します。</p></div>
		<div class="hero-mark" aria-hidden="true"><i class="bi bi-trophy-fill"></i></div>
	</section>

	<div id="app-alert" class="notice hidden mb-6" role="alert"></div>

	<section id="dashboard-screen">
		<div class="mb-5 flex flex-wrap items-center justify-between gap-4"><div><h2 class="section-title">大会一覧</h2><p class="mt-2 text-sm text-slate-500">大会ごとに進行状況をこの端末へ保存します。</p></div><button type="button" class="button button-primary" id="show-create-btn"><i class="bi bi-plus-lg" aria-hidden="true"></i>大会を作成</button></div>
		<div id="tournament-list" class="mb-6 grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>

		<div id="create-panel" class="panel tournament-panel hidden">
			<div class="panel-body p-6 sm:p-8">
				<div class="mb-6 flex items-start justify-between gap-4"><div><p class="section-kicker mb-1">NEW EVENT</p><h2 class="text-2xl font-bold text-slate-950">新しい大会</h2></div><button type="button" class="close-button" id="cancel-create-btn" aria-label="作成を閉じる"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
				<form id="create-form" novalidate>
					<div class="grid gap-5 lg:grid-cols-2">
						<div><label for="event-name" class="field-label">大会名</label><input type="text" class="field-control" id="event-name" maxlength="60" placeholder="例：CUSTOM CUP" required></div>
						<div><label for="event-format" class="field-label">大会形式</label><select class="field-control" id="event-format"><option value="single">シングルエリミネーション</option><option value="double">ダブルエリミネーション</option><option value="round1">1回総当たり</option><option value="round2">2回総当たり</option></select></div>
						<div><label for="base-bo" class="field-label">通常試合</label><select class="field-control" id="base-bo"><option value="1">BO1</option><option value="3" selected>BO3</option><option value="5">BO5</option></select></div>
						<div class="knockout-option"><label for="final-bo" class="field-label">決勝指定試合</label><select class="field-control" id="final-bo"><option value="1">BO1</option><option value="3">BO3</option><option value="5" selected>BO5</option></select><p class="field-help">Grand Final、Lower Final、シングルの3位決定戦に適用</p></div>
						<div class="single-option lg:col-span-2"><label class="flex items-center gap-3 text-sm font-medium text-slate-700"><input class="size-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" type="checkbox" id="third-place" checked>3位決定戦を行う</label></div>
						<div class="lg:col-span-2"><label for="team-names" class="field-label">チーム名</label><textarea class="field-control team-textarea" id="team-names" rows="9" placeholder="1行に1チームずつ入力（2〜32チーム）" required></textarea><div class="flex justify-between gap-3"><span class="field-help">入力順は組み合わせや順位に使用しません。</span><span class="field-help shrink-0"><strong id="team-count-preview">0</strong> / 32</span></div></div>
						<div class="knockout-option"><label for="qualifier-count" class="field-label">本戦進出数</label><select class="field-control" id="qualifier-count"></select></div>
						<div class="knockout-option"><label for="prelim-mode" class="field-label">予選</label><select class="field-control" id="prelim-mode"></select></div>
						<div class="knockout-option" id="block-count-wrap"><label for="block-count" class="field-label">予選ブロック数</label><select class="field-control" id="block-count"></select><p class="field-help" id="block-count-hint"></p></div>
					</div>
					<div id="create-errors" class="notice notice-danger mt-6 hidden" role="alert"></div>
					<div class="mt-6 flex justify-end gap-3"><button type="button" class="button button-secondary" id="cancel-create-secondary">キャンセル</button><button type="submit" class="button button-primary"><i class="bi bi-play-fill" aria-hidden="true"></i>大会を作成</button></div>
				</form>
			</div>
		</div>
	</section>

	<section id="event-screen" class="hidden">
		<div class="event-toolbar panel mb-6"><div class="panel-body flex flex-wrap items-center justify-between gap-4"><div class="flex min-w-0 items-center gap-3"><button type="button" class="button button-secondary button-sm shrink-0" id="back-dashboard-btn"><i class="bi bi-arrow-left" aria-hidden="true"></i><span class="sr-only">大会一覧へ</span></button><div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><h2 class="text-xl font-bold text-slate-950" id="event-title"></h2><span class="badge badge-neutral" id="event-format-badge"></span><span class="badge badge-primary" id="event-phase-badge"></span></div><p class="mt-1 text-xs text-slate-500" id="event-summary"></p></div></div><div class="flex gap-2"><button type="button" class="button button-secondary button-sm" id="reset-event-btn"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>リセット</button><button type="button" class="button button-danger button-sm" id="delete-event-btn"><i class="bi bi-trash" aria-hidden="true"></i>削除</button></div></div></div>
		<div id="event-content"></div>
	</section>
</div>

<script src="{{ '/static/js/tournament.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
