---
layout: default
title: チーム分けへの参加登録
css:
  - /valorant/static/css/team-shuffle.css
---

<div class="shuffle-register shuffle-stack">
	<h1 class="page-title text-center">チーム分けへの参加登録</h1>
	<section class="panel">
		<div class="panel-header">参加者情報</div>
		<div class="panel-body">
			<p id="registration-room" class="field-help shuffle-block">募集を確認しています。</p>
			<form id="registration-form">
				<fieldset id="registration-fields" class="shuffle-fields" disabled>
					<div><label class="field-label" for="p-name">表示名</label><input id="p-name" class="field-control" type="text" maxlength="80" autocomplete="nickname" required></div>
					<div>
						<span class="field-label">Riot ID</span>
						<div class="shuffle-riot-id">
							<label><span class="sr-only">Game Name</span><input id="p-riot-name" class="field-control" type="text" maxlength="64" autocomplete="off" placeholder="Game Name" required></label>
							<span class="shuffle-riot-separator" aria-hidden="true">#</span>
							<label><span class="sr-only">Tagline</span><input id="p-riot-tag" class="field-control" type="text" maxlength="64" autocomplete="off" placeholder="Tagline" required></label>
						</div>
					</div>
					<label class="shuffle-check"><input id="p-vc" type="checkbox" checked>ボイスチャットあり</label>
					<label class="shuffle-check shuffle-consent"><input id="p-rank-consent" type="checkbox" required><span>Riot IDをHenrikDev APIへ送信してランクを取得することに同意します（<a href="https://docs.henrikdev.xyz/api-reference/valorant/get-mmr-by-name-v3" target="_blank" rel="noopener noreferrer">APIについて</a>）</span></label>
					<button id="rank-lookup-btn" class="button button-secondary" type="button" disabled>ランクを取得</button>
					<div id="rank-lookup-result" class="shuffle-rank-result" role="status" aria-live="polite" hidden></div>
					<button id="registration-submit" class="button button-primary" type="submit" disabled>参加登録する</button>
				</fieldset>
			</form>
			<p id="registration-status" class="field-help shuffle-status" role="status" aria-live="polite"></p>
			<button id="registration-retry" class="button button-secondary shuffle-help" type="button" hidden>再確認する</button>
			<p class="field-help shuffle-help">同じブラウザから登録情報を修正できます。チームに入った後は修正できません。途中参加で補充待ちの間は修正可能です。</p>
		</div>
	</section>
	<noscript>参加登録にはJavaScriptを有効にしてください。</noscript>
</div>

<script src="{{ '/valorant/static/js/team-room.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/valorant/static/js/team-register.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
