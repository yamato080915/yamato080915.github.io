---
layout: default
title: チーム分け
---

<h1 class="page-title mb-8 text-center">チーム分け</h1>

<div class="grid items-start gap-6 lg:grid-cols-12">
	<aside class="grid gap-6 lg:col-span-4">
		<section class="panel"><div class="panel-header">プレイヤー追加</div><div class="panel-body">
			<form id="add-player-form" class="grid gap-4">
				<div><label class="field-label" for="p-name">名前</label><input type="text" id="p-name" class="field-control" required></div>
				<div><label class="field-label" for="p-tier">ランク</label><select id="p-tier" class="field-control">
					<option value="iron">Iron</option><option value="bronze">Bronze</option><option value="silver">Silver</option><option value="gold">Gold</option><option value="platinum">Platinum</option><option value="diamond">Diamond</option><option value="ascendant">Ascendant</option><option value="immortal">Immortal</option><option value="radiant">Radiant</option>
				</select></div>
				<div><label class="field-label" for="p-div">ディビジョン</label><select id="p-div" class="field-control"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
				<label class="flex items-center gap-3 text-sm font-medium text-slate-700"><input type="checkbox" class="size-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" id="p-vc" checked>ボイスチャットあり</label>
				<button type="submit" class="button button-primary w-full">追加</button>
			</form>
		</div></section>
		<section class="panel"><div class="panel-header">途中参加プレイヤー (<span id="standby-player-count">0</span>人)</div><div class="panel-body">
			<form id="add-standby-form" class="grid gap-4">
				<div><label class="field-label" for="s-name">名前</label><input type="text" id="s-name" class="field-control" required></div>
				<div><label class="field-label" for="s-tier">ランク</label><select id="s-tier" class="field-control">
					<option value="iron">Iron</option><option value="bronze">Bronze</option><option value="silver">Silver</option><option value="gold">Gold</option><option value="platinum">Platinum</option><option value="diamond">Diamond</option><option value="ascendant">Ascendant</option><option value="immortal">Immortal</option><option value="radiant">Radiant</option>
				</select></div>
				<div><label class="field-label" for="s-div">ディビジョン</label><select id="s-div" class="field-control"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
				<label class="flex items-center gap-3 text-sm font-medium text-slate-700"><input type="checkbox" class="size-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" id="s-vc" checked>ボイスチャットあり</label>
				<button type="submit" class="button button-secondary w-full">途中参加として追加</button>
			</form>
		</div><ul id="standby-player-list" class="list max-h-64 overflow-y-auto"></ul></section>
		<a href="{{ '/valorant/' | relative_url }}" class="text-sm font-semibold text-brand-700 hover:underline">ほかのサービスを見る</a>
	</aside>

	<div class="grid gap-6 lg:col-span-8">
		<section class="panel"><div class="panel-header">プレイヤーリスト (<span id="player-count">0</span>人)</div>
			<ul id="player-list" class="list max-h-80 overflow-y-auto"></ul>
			<div class="border-t border-slate-200 p-5"><div class="flex flex-wrap items-end gap-3">
				<div><label class="field-label" for="team-count">チーム数</label><input type="number" id="team-count" class="field-control w-28" value="2" min="1"></div>
				<button id="shuffle-btn" class="button button-success">チーム分け・補充実行</button>
			</div><p class="field-help mt-3">すでにチーム分けを行っている場合は、退出・途中参加を反映した調整を行います。<br>退出したプレイヤーより途中参加プレイヤーの人数が多い場合、一番ポイントバランスが良い状態になるような選び方となります。</p></div>
		</section>
		<section><div class="mb-4 flex items-center justify-between gap-3"><h2 class="section-title">結果</h2></div><div id="result" class="grid gap-4 md:grid-cols-2"></div></section>
	</div>
</div>

<script src="{{ '/valorant/static/js/team-shuffle.js' | relative_url }}"></script>
