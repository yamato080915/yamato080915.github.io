---
layout: default
css:
  - /valorant/static/css/ban-pick.css
title: バンピック
---

<h1 class="text-center mb-4">バンピック</h1>
<h3 class="text-center mb-4">マップ：V26: Act4</h3>

<div class="row justify-content-center mb-4">
	<div class="col-lg-8">
		<div class="card shadow-sm">
			<div class="card-body">
				<div class="row g-3 align-items-end">
					<div class="col-md-4">
						<label class="form-label fw-bold">フォーマット</label>
						<select class="form-select" id="formatSelect">
							<option value="bo3">Best of 3</option>
							<option value="bo5">Best of 5</option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label fw-bold">Team A (上位シード)</label>
						<input type="text" class="form-control" id="teamAName" placeholder="Team A" value="Team A">
					</div>
					<div class="col-md-4">
						<label class="form-label fw-bold">Team B</label>
						<input type="text" class="form-control" id="teamBName" placeholder="Team B" value="Team B">
					</div>
				</div>
				<div class="text-center mt-3">
					<button type="button" class="btn btn-primary btn-lg" id="startBtn">
						<i class="bi bi-play-fill"></i> バンピックを開始
					</button>
					<button type="button" class="btn btn-outline-secondary btn-lg d-none" id="restartBtn">
						<i class="bi bi-arrow-counterclockwise"></i> やり直す
					</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="row justify-content-center mb-4 d-none" id="processArea">
	<div class="col-lg-8">
		<div class="card shadow-sm border-primary">
			<div class="card-body text-center">
				<div class="text-muted mb-1" id="stepCounter">STEP 1</div>
				<h4 class="mb-3" id="instructionText"></h4>
				<div class="d-flex flex-wrap justify-content-center gap-2" id="actionArea"></div>
			</div>
		</div>
	</div>
</div>

<div class="row justify-content-center mb-4 d-none" id="logArea">
	<div class="col-lg-8">
		<div class="card shadow-sm">
			<div class="card-body">
				<h5 class="card-title mb-3"><i class="bi bi-list-check"></i> 進行状況</h5>
				<ul class="list-group list-group-flush" id="logList"></ul>
			</div>
		</div>
	</div>
</div>

<div class="row justify-content-center mb-5 d-none" id="resultArea">
	<div class="col-lg-8">
		<div class="card shadow-sm border-success">
			<div class="card-body">
				<h5 class="card-title mb-3 text-success"><i class="bi bi-trophy"></i> 対戦マップ確定</h5>
				<div class="table-responsive">
					<table class="table table-bordered align-middle text-center mb-0">
						<thead class="table-light">
							<tr>
								<th>MAP</th>
								<th>マップ名</th>
								<th id="attackHeader"></th>
								<th id="defenseHeader"></th>
							</tr>
						</thead>
						<tbody id="resultTableBody"></tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</div>

<script src="/valorant/static/js/ban-pick.js"></script>
