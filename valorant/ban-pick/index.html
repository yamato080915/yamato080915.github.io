layout: default
title: バンピック
---

<div class="mx-auto max-w-5xl">
	<div class="mb-8 text-center"><h1 class="page-title">バンピック</h1><h3 class="mt-4 text-xl font-semibold text-slate-700">マップ：V26: Act5</h3></div>
	<section class="panel"><div class="panel-body"><div class="grid items-end gap-4 md:grid-cols-3">
		<div><label class="field-label" for="formatSelect">フォーマット</label><select class="field-control" id="formatSelect"><option value="bo3">Best of 3</option><option value="bo5">Best of 5</option></select></div>
		<div><label class="field-label" for="teamAName">Team A (上位シード)</label><input type="text" class="field-control" id="teamAName" placeholder="Team A" value="Team A"></div>
		<div><label class="field-label" for="teamBName">Team B</label><input type="text" class="field-control" id="teamBName" placeholder="Team B" value="Team B"></div>
	</div><div class="mt-6 flex flex-wrap justify-center gap-3"><button type="button" class="button button-primary button-lg" id="startBtn"><i class="bi bi-play-fill" aria-hidden="true"></i>バンピックを開始</button><button type="button" class="button button-secondary button-lg hidden" id="restartBtn"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>やり直す</button></div></div></section>

	<section class="panel mt-6 hidden border-brand-500/40" id="processArea"><div class="panel-body text-center"><p class="text-xs font-bold tracking-widest text-brand-600" id="stepCounter">STEP 1</p><h2 class="mt-2 text-xl font-bold text-slate-950" id="instructionText"></h2><div class="mt-5 flex flex-wrap justify-center gap-2" id="actionArea"></div></div></section>
	<section class="panel mt-6 hidden" id="logArea"><div class="panel-header"><i class="bi bi-list-check mr-2" aria-hidden="true"></i>進行状況</div><ul class="list" id="logList"></ul></section>
	<section class="panel mt-6 hidden border-emerald-300" id="resultArea"><div class="panel-header text-emerald-700"><i class="bi bi-trophy mr-2" aria-hidden="true"></i>対戦マップ確定</div><div class="panel-body"><div class="table-wrap"><table class="data-table text-center"><thead><tr><th>MAP</th><th>マップ名</th><th id="attackHeader"></th><th id="defenseHeader"></th></tr></thead><tbody id="resultTableBody"></tbody></table></div></div></section>
</div>
