---
layout: default
title: マップルーレット
---

<h1 class="text-center mb-4">マップルーレット</h1>

<div class="row justify-content-center mb-4">
	<div class="col-lg-8">
		<div class="card shadow-sm">
			<div class="card-body">
				<h5 class="card-title mb-3"><i class="bi bi-slash-circle"></i> BANするマップを選択</h5>
				<div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2" id="mapList">
					<!-- チェックボックスはJSで生成 -->
				</div>
			</div>
		</div>
	</div>
</div>

<div class="row justify-content-center mb-4">
	<div class="col-lg-8 d-flex justify-content-center gap-2">
		<button type="button" class="btn btn-primary btn-lg" id="pickBtn">
			<i class="bi bi-shuffle"></i> マップを選ぶ
		</button>
		<button type="button" class="btn btn-outline-secondary btn-lg" id="resetBtn">
			<i class="bi bi-arrow-counterclockwise"></i> BANをリセット
		</button>
	</div>
</div>

<div class="row justify-content-center">
	<div class="col-lg-8">
		<div class="card shadow-sm">
			<div class="card-body py-5">
				<div class="slot-window mx-auto" id="slotWindow">
					<div class="slot-strip" id="slotStrip">
						<div class="slot-item">?</div>
					</div>
				</div>
				<div class="text-center mt-3">
					<span class="text-muted" id="hintText">「マップを選ぶ」ボタンを押してください</span>
				</div>
			</div>
		</div>
	</div>
</div>

<style>
	#mapList .form-check {
		position: relative;
		border: 2px solid rgba(128,128,128,0.3);
		border-radius: 0.5rem;
		padding: 0.5rem 0.5rem 0.5rem 2.5rem;
		background-size: cover;
		background-position: center;
		overflow: hidden;
		min-height: 56px;
		display: flex;
		align-items: center;
	}
	#mapList .form-check-tint {
		position: absolute;
		inset: 0;
		background: rgba(0,0,0,0.45);
		transition: background-color 0.15s ease;
		z-index: 0;
	}
	#mapList .form-check-input,
	#mapList .form-check-label {
		position: relative;
		z-index: 1;
	}
	#mapList .form-check-label {
		color: #fff;
		text-shadow: 0 1px 3px rgba(0,0,0,0.9);
		font-weight: 600;
	}
	#mapList .form-check-input:checked ~ .form-check-label {
		text-decoration: line-through;
	}
	#mapList .form-check.banned {
		border-color: rgba(255,0,0,0.7);
	}
	#mapList .form-check.banned .form-check-tint {
		background: rgba(180,0,0,0.6);
	}

	.slot-window {
		width: 260px;
		height: 90px;
		overflow: hidden;
		border: 2px solid #333;
		border-radius: 0.5rem;
		background: #fff;
		position: relative;
	}
	.slot-window::before,
	.slot-window::after {
		content: "";
		position: absolute;
		left: 0;
		right: 0;
		height: 30px;
		pointer-events: none;
		z-index: 2;
	}
	.slot-window::before {
		top: 0;
		background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,255,255,0));
	}
	.slot-window::after {
		bottom: 0;
		background: linear-gradient(to top, rgba(255,255,255,0.9), rgba(255,255,255,0));
	}
	.slot-strip {
		display: flex;
		flex-direction: column;
	}
	.slot-item {
		height: 90px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-family: "Squada One";
		font-size: 2rem;
		letter-spacing: 0.05em;
		text-transform: capitalize;
		flex-shrink: 0;
		background-size: cover;
		background-position: center;
		color: #fff;
		text-shadow: 0 1px 4px rgba(0,0,0,0.9);
	}
</style>

<script>
	const MAPS = [
		"abyss", "ascent", "bind", "breeze", "corrode", "fracture", "haven", "icebox", "lotus", "pearl", "split", "summit", "sunset"
	];
	const ITEM_HEIGHT = 90;

	function mapImageUrl(map) {
		return `url('/valorant/static/${map.toLowerCase()}.png')`;
	}

	const mapListEl = document.getElementById("mapList");
	const slotStrip = document.getElementById("slotStrip");
	const hintText = document.getElementById("hintText");
	const pickBtn = document.getElementById("pickBtn");
	const resetBtn = document.getElementById("resetBtn");

	// チェックボックス一覧を生成
	MAPS.forEach((map) => {
		const col = document.createElement("div");
		col.className = "col";

		const wrapper = document.createElement("div");
		wrapper.className = "form-check";
		wrapper.id = `wrap-${map}`;
		wrapper.style.backgroundImage = mapImageUrl(map);

		const tint = document.createElement("div");
		tint.className = "form-check-tint";

		const input = document.createElement("input");
		input.className = "form-check-input";
		input.type = "checkbox";
		input.id = `ban-${map}`;
		input.value = map;
		input.addEventListener("change", () => {
			wrapper.classList.toggle("banned", input.checked);
		});

		const label = document.createElement("label");
		label.className = "form-check-label text-capitalize";
		label.setAttribute("for", `ban-${map}`);
		label.textContent = map;

		wrapper.appendChild(tint);
		wrapper.appendChild(input);
		wrapper.appendChild(label);
		col.appendChild(wrapper);
		mapListEl.appendChild(col);
	});

	function getBannedMaps() {
		return MAPS.filter((map) => document.getElementById(`ban-${map}`).checked);
	}

	function pickRandomMap() {
		const banned = getBannedMaps();
		const candidates = MAPS.filter((map) => !banned.includes(map));

		if (candidates.length === 0) {
			hintText.innerHTML = `<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> 全てのマップがBANされています</span>`;
			return;
		}

		pickBtn.disabled = true;
		resetBtn.disabled = true;
		hintText.textContent = "抽選中…";

		const chosen = candidates[Math.floor(Math.random() * candidates.length)];

		// スロット演出用に、候補マップをランダムに並べたリストを作り、
		// 最後の要素を当選マップにする
		const REEL_LENGTH = 24;
		const reel = [];
		for (let i = 0; i < REEL_LENGTH - 1; i++) {
			reel.push(candidates[Math.floor(Math.random() * candidates.length)]);
		}
		reel.push(chosen);

		// ストリップを再構築し、アニメーションなしで先頭位置に戻す
		slotStrip.style.transition = "none";
		slotStrip.style.transform = "translateY(0)";
		slotStrip.innerHTML = "";
		reel.forEach((map) => {
			const item = document.createElement("div");
			item.className = "slot-item";
			item.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), ${mapImageUrl(map)}`;
			item.textContent = map;
			slotStrip.appendChild(item);
		});

		// 強制リフロー後、減速しながら最後の項目まで回転させる
		void slotStrip.offsetHeight;
		const targetY = -(ITEM_HEIGHT * (reel.length - 1));
		slotStrip.style.transition = "transform 2.4s cubic-bezier(0.15, 0.85, 0.25, 1)";
		slotStrip.style.transform = `translateY(${targetY}px)`;

		slotStrip.addEventListener("transitionend", function onEnd() {
			slotStrip.removeEventListener("transitionend", onEnd);
			hintText.innerHTML = `選ばれたマップ: <strong class="text-capitalize">${chosen}</strong>`;
			pickBtn.disabled = false;
			resetBtn.disabled = false;
		}, { once: true });
	}

	function resetBans() {
		MAPS.forEach((map) => {
			const input = document.getElementById(`ban-${map}`);
			input.checked = false;
			document.getElementById(`wrap-${map}`).classList.remove("banned");
		});
		slotStrip.style.transition = "none";
		slotStrip.style.transform = "translateY(0)";
		slotStrip.innerHTML = `<div class="slot-item">?</div>`;
		hintText.textContent = "「マップを選ぶ」ボタンを押してください";
	}

	pickBtn.addEventListener("click", pickRandomMap);
	resetBtn.addEventListener("click", resetBans);
</script>
